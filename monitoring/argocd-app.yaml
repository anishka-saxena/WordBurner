apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
  sources:
    # Source 1: the remote chart
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 87.19.1
      helm:
        valueFiles:
          - $values/monitoring/values.yaml
    # Source 2: YOUR repo, only to supply the values file
    - repoURL: https://github.com/anishka-saxena/WordBurner.git
      targetRevision: main
      ref: values