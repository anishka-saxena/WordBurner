apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wordburner
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anishka-saxena/WordBurner.git
    targetRevision: main
    path: charts/wordburner
  destination:
    server: https://kubernetes.default.svc
    namespace: wordburner
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true 
